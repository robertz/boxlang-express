name: Tests

# Runs the TestBox suite against pinned BoxLang releases, not just "whatever
# :cli currently floats to" — a BoxLang 1.17.0 release changed template-path
# resolution behavior in a way that broke every res.render() call downstream
# (see the 0.2.3 changelog entry in README.md), and nothing caught it until
# it reached production. This matrix would have failed on that PR.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # TestBox (and its own transitive deps — cbstreams, cbproxies, cbMockData,
  # globber) is a `box install` devDependency (box.json), gitignored rather
  # than committed — regenerate it once here via real CommandBox and hand it
  # to every matrix job below as an artifact, instead of each job trying to
  # fetch it itself. install-bx-module can't resolve all of TestBox's own
  # dependencies (confirmed: 404s on cbMockData/globber), so this has to be
  # actual CommandBox, not the plain BoxLang CLI image used for the test run.
  install-deps:
    runs-on: ubuntu-latest
    container:
      image: ortussolutions/commandbox:boxlang
    steps:
      - uses: actions/checkout@v4
      - run: box install
      - uses: actions/upload-artifact@v4
        with:
          name: box-dependencies
          path: |
            testbox/
            boxlang_modules/
          retention-days: 1

  test:
    needs: install-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Last two released minors — kept in sync manually; bump the older
          # one forward as BoxLang releases new minors, so this always covers
          # "previous stable" + "current stable".
          - tag: cli-1.16.0
            allow-failure: false
          - tag: cli-1.17.0
            allow-failure: false
          # Floating tag: an early-warning canary for whatever BoxLang ships
          # next. Allowed to fail — it flags a coming break without blocking
          # merges on something outside this repo's control.
          - tag: cli
            allow-failure: true
    continue-on-error: ${{ matrix.allow-failure }}
    container:
      image: ortussolutions/boxlang:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: box-dependencies

      - name: Register this checkout as a BoxLang module
        run: boxlang setup-tests.bxs

      - name: Run test suite
        run: boxlang run-tests.bxs
